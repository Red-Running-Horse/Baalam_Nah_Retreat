name: Deploy Baalam-Nah

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: baalam-nah-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://baalamnah.fcpqroo.mx

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint website
        run: npm run lint --workspace "Project References/horizons-export-90021aa3-5e36-403a-b9b6-24f4f6e8230d/apps/web"

      - name: Build production website
        run: npm run build

      - name: Configure Hostinger SSH access
        env:
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          test -n "$HOSTINGER_KNOWN_HOSTS"
          test -n "$HOSTINGER_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger
          chmod 600 ~/.ssh/known_hosts

      - name: Publish static files
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: |
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_WEB_ROOT"
          ssh -i ~/.ssh/hostinger -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$HOSTINGER_WEB_ROOT'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hostinger -p $HOSTINGER_PORT" \
            dist/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_WEB_ROOT/"

      - name: Verify production site
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              --retry 2 \
              https://baalamnah.fcpqroo.mx/ |
              grep --quiet "Baalam-Nah"; then
              exit 0
            fi
            sleep 10
          done
          echo "The deployed homepage did not return the expected Baalam-Nah brand."
          exit 1
